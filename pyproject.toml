[project]
name = "voice-agent-via-gateway"
version = "0.1.0"
description = "Voice agent prototype: browser UI -> Python WS proxy -> APIM gateway -> Foundry Voice Live agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.1",
    "azure-identity>=1.19.0",
    "python-dotenv>=1.0.1",
    "azure-monitor-opentelemetry>=1.8.9",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
]

[dependency-groups]
# Reference/probe scripts (direct Voice Live connection, not needed to run the app).
dev = [
    "azure-ai-voicelive>=1.2.0",
]

[tool.uv]
package = false
